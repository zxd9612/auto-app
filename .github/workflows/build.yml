name: Build APK
on: {push: {branches: [main]}, workflow_dispatch:}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4; with: {java-version: '17', distribution: 'temurin'}
      - name: Setup Android SDK
        run: |
          ANDROID_HOME=/usr/local/lib/android/sdk; mkdir -p $ANDROID_HOME
          curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o c.zip
          unzip -q c.zip -d $ANDROID_HOME/cmdline-tools; mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" "build-tools;34.0.0"
      - run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4; with: {name: app-debug, path: app/build/outputs/apk/debug/app-debug.apk}
